services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: astra-core
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./orchestrator/output:/app/orchestrator/output
      # Mount source code for development (optional, remove for production)
      - ./orchestrator:/app/orchestrator
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astra-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - orchestrator
    restart: unless-stopped
