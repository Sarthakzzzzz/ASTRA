services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: astra-core
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./orchestrator/output:/app/orchestrator/output
      # Mount source code for development (optional, remove for production)
      - ./orchestrator:/app/orchestrator
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: astra-ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - BACKEND_URL=http://orchestrator:8000
      - ASTRA_API_TOKEN=${ASTRA_API_TOKEN}
      - APP_PASSWORD=${APP_PASSWORD}
    depends_on:
      - orchestrator
    restart: unless-stopped
